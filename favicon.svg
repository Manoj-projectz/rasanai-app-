<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3C363"/>
      <stop offset="0.45" stop-color="#D6551F"/>
      <stop offset="1" stop-color="#7E2413"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#F1D6B4"/>
    </linearGradient>
    <linearGradient id="soup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B84A"/>
      <stop offset="1" stop-color="#D6551F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App-icon tile -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#sheen)"/>

  <!-- Steam wisps -->
  <g fill="none" stroke="#FFF7EC" stroke-width="3.4" stroke-linecap="round">
    <path d="M39 40 q-5 -7 0 -13 q4 -5 0 -11" opacity="0.55"/>
    <path d="M50 37 q-5 -7 0 -13 q4 -5 0 -11" opacity="0.85"/>
    <path d="M61 40 q-5 -7 0 -13 q4 -5 0 -11" opacity="0.55"/>
  </g>

  <!-- Bowl -->
  <path d="M22 55 h56 a4 4 0 0 1 4 4 a32 30 0 0 1 -64 0 a4 4 0 0 1 4 -4 Z" fill="url(#bowl)"/>
  <!-- Soup surface (the rim opening) -->
  <ellipse cx="50" cy="56" rx="27" ry="6.4" fill="url(#soup)"/>
  <ellipse cx="50" cy="55.4" rx="27" ry="6.4" fill="none" stroke="#FFF7EC" stroke-width="1.6" opacity="0.8"/>
  <!-- Foot / base -->
  <path d="M42 82 q8 4 16 0" fill="none" stroke="#5E1B0E" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- AI spark, top right -->
  <g transform="translate(72 30)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FFF7EC"/>
    <circle cx="0" cy="0" r="1.6" fill="#F3C363"/>
  </g>
</svg>
