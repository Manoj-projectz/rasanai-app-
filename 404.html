<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0603" />
  <meta name="robots" content="noindex" />
  <title>Page not found &middot; RasanAi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{ --gold:#E8B84A; --gold-lt:#F7D98A; --red:#C0431F; --red-lt:#E8724E; --bg:#0A0603; --cream:#F3E9DC; --muted:#B8A897; }
    *{box-sizing:border-box;margin:0;}
    html,body{height:100%;}
    body{ background:radial-gradient(60% 45% at 80% -5%, rgba(192,67,31,.18), transparent 60%), var(--bg);
      color:var(--cream); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
      display:flex; align-items:center; justify-content:center; padding:28px; text-align:center;}
    .wrap{max-width:520px;}
    .mark{font-family:'DM Serif Display',serif; font-size:30px; color:var(--cream); margin-bottom:28px;}
    .mark b{color:var(--gold); font-weight:400;}
    .code{font-family:'DM Serif Display',serif; font-size:clamp(68px,18vw,120px); line-height:1; background:linear-gradient(100deg,var(--gold-lt),var(--red-lt)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
    h1{font-family:'DM Serif Display',serif; font-weight:400; font-size:clamp(24px,5vw,32px); margin-top:10px; letter-spacing:-.01em;}
    p{color:var(--muted); font-size:16px; margin-top:14px; line-height:1.55;}
    .btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:28px;}
    .btn{text-decoration:none; font-weight:700; font-size:14.5px; padding:12px 22px; border-radius:999px;}
    .btn.p{color:#1a0f06; background:linear-gradient(135deg,var(--gold-lt),var(--gold));}
    .btn.s{color:var(--cream); border:1px solid rgba(243,233,220,.22);}
    .links{margin-top:26px; font-size:13.5px; color:var(--muted);}
    .links a{color:var(--gold-lt); text-decoration:none; margin:0 8px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Rasan<b>Ai</b></div>
    <div class="code">404</div>
    <h1>This page has gone off the menu</h1>
    <p>The page you were looking for does not exist or has moved. Let us get you back to the good stuff.</p>
    <div class="btns">
      <a class="btn p" href="/">Back to home</a>
      <a class="btn s" href="/get">Get the app</a>
    </div>
    <div class="links">
      <a href="/privacy">Privacy</a>&middot;
      <a href="/terms">Terms</a>&middot;
      <a href="/refunds">Refunds</a>
    </div>
  </div>
</body>
</html>
